---
name: Review allowlist for known-vulnerable actions
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    uses: stackhpc/gha-tools/.github/workflows/review.yml@main
    with:
      org: "@ORG@"
    secrets:
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
